<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application Tracker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <h1>Application Tracker</h1>
        <p id="page-title" class="page-title">Current page</p>
      </header>

      <section id="submission-summary" class="submission-summary" aria-live="polite" hidden>
        <p class="submission-status">Application submitted</p>
        <dl class="submission-details">
          <div>
            <dt>Company</dt>
            <dd id="submitted-company">Not detected.</dd>
          </div>
          <div>
            <dt>Position</dt>
            <dd id="submitted-position">Not detected.</dd>
          </div>
        </dl>
      </section>

      <section id="backend-summary" class="backend-summary" aria-live="polite" hidden>
        <p id="backend-status" class="backend-status">Spreadsheet update pending</p>
        <p id="backend-message" class="backend-message"></p>
      </section>

      <section class="metadata-list" aria-live="polite">
        <div class="metadata-row">
          <dt>Company</dt>
          <dd id="company-name">Loading...</dd>
        </div>
        <div class="metadata-row">
          <dt>Position</dt>
          <dd id="position">Loading...</dd>
        </div>
        <div class="metadata-row">
          <dt>Date Posted</dt>
          <dd id="date-posted">Loading...</dd>
        </div>
        <div class="metadata-row">
          <dt>URL</dt>
          <dd id="website-link">Loading...</dd>
        </div>
        <div class="metadata-row">
          <dt>Resume Upload</dt>
          <dd id="resume-req">Loading...</dd>
        </div>
        <div class="metadata-row">
          <dt>Cover Letter Upload</dt>
          <dd id="cover-letter-req">Loading...</dd>
        </div>
      </section>

      <p id="status-message" class="status-message" role="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
